name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y web-ext@8 lint --self-hosted
      - run: zip -r rightclickcopy.xpi manifest.json background.js content.js icon.svg LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: rightclickcopy
          path: rightclickcopy.xpi
      - if: startsWith(github.ref,'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: rightclickcopy.xpi
permissions:
  contents: write
